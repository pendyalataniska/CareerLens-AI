name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: careerlens
          POSTGRES_USER: careerlens_user
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerlens_user -d careerlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://careerlens_user:ci-only-password@localhost:5432/careerlens
      SECRET_KEY: ci-only-generated-style-secret-not-for-deployment
      DB_PASSWORD: ci-only-password
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend/app backend/tests
      - run: python -m pytest backend/tests -q
      - run: alembic -c alembic.ini upgrade head
      - run: alembic -c alembic.ini check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
